name: ${COMPOSE_PROJECT_NAME:-mini-market}

services:
  php:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-pos_store}
      DB_USERNAME: ${DB_USERNAME:-db_user}
      DB_PASSWORD: ${DB_PASSWORD:-Pass1Word#}
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network

  nginx-mini-market:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT_HTTP:-8110}:80"
    volumes:
      - ./:/var/www:ro
      - ./.docker/nginx/conf.d/:/etc/nginx/conf.d/:ro
    depends_on:
      - php
    networks:
      - network

  nginx-print:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT_HTTP_PRINT_SERVER:-8200}:85"
      - "${APP_PORT_HTTPS_PRINT_SERVER:-8201}:446"
    volumes:
      - ./:/var/www:ro
      - ./.docker/nginx_print_server/conf.d/:/etc/nginx/conf.d/:ro
    depends_on:
      - php
    networks:
      - network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-3310}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pos_store}
      MYSQL_USER: ${DB_USERNAME:-db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Pass1Word#}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata_pos:/var/lib/mysql/
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./backup-28th-august-2026.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - ./files/updates/db_updates/4_0_30.sql:/docker-entrypoint-initdb.d/02-cost-sales.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  dbdata_pos:
    driver: local